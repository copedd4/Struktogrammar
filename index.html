<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- apply the stored theme before the first paint (see THEME_BOOT_SCRIPT) -->
    <script>try{var t=localStorage.getItem("strukto.theme")||"light",r=document.documentElement;r.dataset.theme=t;if(t==="dark"||t==="navy"||t==="siemens")r.classList.add("dark");var l=localStorage.getItem("strukto.lang");if(l==="de"||l==="en")r.lang=l}catch(e){}</script>
    <title>Struktogrammer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
